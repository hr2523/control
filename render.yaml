services:
  - type: web
    name: hourglass-rate
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: MIN_RATE
        value: "10"
      - key: MAX_RATE
        value: "60"
      - key: WINDOW_SEC
        value: "10"
      - key: SMOOTHING
        value: "0.3"
